apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-ingress
  namespace: default
  annotations:
    # Use GCP HTTP(S) Load Balancer (external, global).
    kubernetes.io/ingress.class: "gce"
    # Bind the reserved static IP provisioned by Terraform.
    # SUBSTITUTE: APP_NAME must match var.project_name in terraform.tfvars.
    kubernetes.io/ingress.global-static-ip-name: "APP_NAME-lb-ip"
    # GKE-native managed TLS certificate — references ManagedCertificate CRD in managed-certificate.yaml.
    # GKE Ingress controller provisions and attaches the GCP-managed SSL cert automatically.
    networking.gke.io/managed-certificates: "APP_NAME-ssl-cert"
    # HTTP → HTTPS redirect via FrontendConfig CRD (frontend-config.yaml).
    networking.gke.io/v1beta1.FrontendConfig: "http-to-https-redirect"
spec:
  defaultBackend:
    service:
      name: django-blue-svc
      port:
        number: 80
