apiVersion: v1
kind: ServiceAccount
metadata:
  name: django-ksa
  namespace: default
  annotations:
    # The WI binding (default/django-ksa → APP_NAME-app-sa) is provisioned by Terraform.
    # SUBSTITUTE: APP_NAME must match var.project_name; PROJECT_ID is your GCP project ID.
    iam.gke.io/gcp-service-account: APP_NAME-app-sa@PROJECT_ID.iam.gserviceaccount.com
